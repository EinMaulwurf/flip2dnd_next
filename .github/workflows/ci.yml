name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint, and build
        run: ./gradlew --no-daemon :core:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Name test APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Flip2DND-Next-debug.apk
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flip2DND-Next-${{ github.sha }}
          path: |
            Flip2DND-Next-debug.apk
            core/build/reports/tests/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 14
