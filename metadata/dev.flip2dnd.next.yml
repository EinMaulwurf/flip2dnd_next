Description: |-
  Flip2DND Next automatically activates Do Not Disturb when you put your phone
  face down and restores your previous state when you flip it back up.

  An independently developed evolution of Flip2DND by Abul Kalam Robin, with
  configurable detection, proximity gating, schedule windows, audio-device and
  media filters, custom audio, and adjustable vibration feedback.

  No ads or tracking. Open source under the MIT license.
